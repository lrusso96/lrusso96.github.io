<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    {% if not current_path %}
    <meta http-equiv="refresh" content="3; url={{ config.base_url }}" />
    {% endif %}
    <title>Luigi Russo</title>
    <meta name="description" content="Postdoctoral researcher in Cryptography.">
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}" type="text/css" />
  </head>

<body>
  <header class="site-header">

    {% if not current_path or current_path != '/' %}
    <a href="/" class="logo">LR</a>
    {% endif %}

    <input type="checkbox" id="nav-toggle" class="nav-toggle">

    <label for="nav-toggle" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <nav class="menu" role="navigation">
        <a href="{{get_url(path='/')}}">About</a>
        <a href="{{get_url(path='publications')}}">Publications</a>
        <a href="https://pets.wien/teaching/">Teaching</a>
    </nav>

</header>


  <main class="container" role="main">
    {% block content %} {% endblock content %}
  </main>
</body>

</html>
